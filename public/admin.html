<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komisyon Paneli — BAÜN Staj</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
         background: #f3f5f9; color: #1c2430; font-size: 16px; line-height: 1.55; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 36px 60px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px; }
  h1 { font-size: 23px; font-family: Georgia, "Times New Roman", serif; color: #0f3d78; }
  h2 { font-size: 16.5px; margin: 26px 0 10px; text-transform: uppercase; letter-spacing: .04em; color: #5c6b80; }
  .stats { color: #5c6b80; font-size: 14.5px; }
  .card { background: #fff; border: 1px solid #dbe1ea; border-radius: 9px; padding: 18px 20px; margin: 10px 0; }
  .card .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .who { font-weight: 700; }
  .meta { color: #5c6b80; font-size: 14.5px; margin: 6px 0; }
  .badge { display: inline-block; font-size: 13px; font-weight: 700; border-radius: 5px; padding: 3px 10px; }
  .b-sub { background: #e8f0fd; color: #1f5fd1; }
  .b-def { background: #fef9c3; color: #854d0e; }
  .b-sic { background: #dcfce7; color: #166534; }
  .b-staj { background: #0f3d78; color: #fff; }
  button { font-family: inherit; font-size: 14.5px; border-radius: 7px; padding: 9px 15px; cursor: pointer;
           border: 1.5px solid #c7ced9; background: #fff; margin: 4px 6px 0 0; }
  button.ok { background: #16a34a; border-color: #16a34a; color: #fff; font-weight: 600; }
  button.warn { background: #b45309; border-color: #b45309; color: #fff; font-weight: 600; }
  button.bad { color: #b91c1c; border-color: #fca5a5; }
  select, textarea, input { font-family: inherit; font-size: 14.5px; border: 1.5px solid #c7ced9;
    border-radius: 7px; padding: 9px 11px; width: 100%; margin-top: 6px; }
  a { color: #1f5fd1; }
  .empty { color: #5c6b80; background: #fff; border: 1px dashed #c7ced9; border-radius: 9px;
           padding: 18px; text-align: center; }
  .login { max-width: 380px; margin: 60px auto; background: #fff; border: 1px solid #dbe1ea;
           border-radius: 10px; padding: 26px; }
  .login input { margin-bottom: 10px; padding: 12px; font-size: 16px; }
  .login button { width: 100%; padding: 13px; font-size: 16px; background: #1f5fd1; color: #fff;
                  border: 0; font-weight: 600; }
  .err { background: #fee2e2; border: 1px solid #fca5a5; border-radius: 8px; padding: 10px 12px;
         font-size: 14.5px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
const $ = (id) => document.getElementById(id);

async function api(path, opts = {}) {
  if (opts.json) { opts.body = JSON.stringify(opts.json); opts.headers = { "Content-Type": "application/json" }; delete opts.json; }
  const r = await fetch("/api" + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "İşlem başarısız.");
  return data;
}

function loginScreen(msg) {
  $("root").innerHTML = `
    <div class="login">
      <h1 style="margin-bottom:14px">Komisyon girişi</h1>
      ${msg ? `<div class="err">${msg}</div>` : ""}
      <input id="no" placeholder="Kullanıcı adı">
      <input id="pw" type="password" placeholder="Şifre">
      <button onclick="doLogin()">Giriş yap</button>
    </div>`;
}
async function doLogin() {
  try {
    const r = await api("/login", { method: "POST", json: { no: $("no").value, pass: $("pw").value } });
    if (r.role !== "admin") return loginScreen("Bu hesap komisyon hesabı değil.");
    load();
  } catch (e) { loginScreen(e.message); }
}

// Düzeltme isterken hazır şablonlar: öğrenciye giden metnin kalitesini garanti eder.
const TEMPLATES = [
  "Yüklediğin kabul belgesinde işletme kaşesi görünmüyor. Belgeyi işletmeye kaşelettikten sonra yeniden yükle.",
  "Yüklediğin belgede imza eksik. İşletme yetkilisine imzalattıktan sonra yeniden yükle.",
  "Yüklediğin dosya okunamıyor. Belgeyi düz bir zeminde, aydınlık ortamda çekip yeniden yükle.",
  "Yanlış belge yüklenmiş görünüyor. İşletmenin imzaladığı staj kabul belgesini (EK-1) yüklemelisin.",
  "Defterinde bazı günlerin sayfası eksik. Her staj günü için ayrı sayfa olacak şekilde tamamlayıp yeniden yükle.",
  "Defter sayfalarında işyeri sorumlusunun imzası eksik. İmzalattıktan sonra yeniden yükle.",
];

function appCard(a) {
  const isDefter = a.status === "evaluating";
  const sicilOnly = !isDefter && a.status !== "submitted";
  const DOC_AD = { kabul: "Kabul belgesi (EK-1)", ek2: "Ücret katkısı formu (EK-2)",
    ek3: "Öğrenci bilgi evrakı (EK-3)", defter: "Staj defteri" };
  const docs = a.documents.map(d =>
    `<a href="/api/admin/file/${d.id}">📎 ${DOC_AD[d.kind] || d.kind} (${d.orig_name})</a>`).join(" · ") || "—";
  const tmpl = TEMPLATES.map((t, i) => `<option value="${i}">${t.slice(0, 70)}…</option>`).join("");
  return `<div class="card">
    <div class="top">
      <span class="who">${a.name} <span class="meta">· ${a.ogrenci_no}</span></span>
      <span><span class="badge b-staj">${a.staj_no}. Staj</span>
      <span class="badge ${isDefter ? "b-def" : sicilOnly ? "b-sic" : "b-sub"}">
        ${isDefter ? "Defter değerlendirme" : sicilOnly ? "Sicil fişi onayı" : "Yeni başvuru"}</span></span>
    </div>
    <div class="meta">${a.kurum_adi || "—"} (${a.kurum_sehir || "—"}) · ${a.tur === "donem" ? "dönem içi" : "yaz"} ·
      ${a.start_date} → ${a.end_date} · <b>${a.workdays ?? "?"} iş günü</b> ·
      sorumlu: ${a.muh_ad || "—"} (${a.muh_unvan || "—"}) · ücret: ${a.ucret || "—"}</div>
    <div class="meta">Belgeler: ${docs}</div>
    ${a.sicil_delivered && !a.sicil_confirmed ? `
      <div class="meta">✉️ Öğrenci sicil fişi zarfını teslim ettiğini bildirdi.
      <button class="ok" onclick="act('/admin/sicil/${a.id}/confirm',{})">Zarf ulaştı, onayla</button></div>` : ""}
    ${!sicilOnly ? `
      <select id="t${a.id}"><option value="">Düzeltme şablonu seç (veya aşağıya yaz)…</option>${tmpl}</select>
      <textarea id="n${a.id}" rows="2" placeholder="Öğrencinin göreceği açıklama — ne + neden + nasıl"></textarea>
      <div>
        ${isDefter
          ? `<button class="ok" onclick="decide(${a.id},'accept_defter')">Stajı kabul et</button>
             <button class="warn" onclick="decide(${a.id},'fix_defter')">Defterde düzeltme iste</button>`
          : `<button class="ok" onclick="decide(${a.id},'approve')">Onayla</button>
             <button class="warn" onclick="decide(${a.id},'fix')">Düzeltme iste</button>
             <button class="bad" onclick="decide(${a.id},'reject')">Reddet</button>`}
      </div>` : ""}
  </div>`;
}

function qCard(q) {
  return `<div class="card">
    <div class="who">${q.name} <span class="meta">· ${q.ogrenci_no} · ${q.created_at.slice(0, 10)}</span></div>
    <p style="margin:8px 0">${q.text}</p>
    <textarea id="qa${q.id}" rows="2" placeholder="Cevabın — öğrencinin diliyle"></textarea>
    <label style="font-size:13.5px;display:flex;gap:8px;align-items:center;margin-top:6px">
      <input type="checkbox" id="qf${q.id}" style="width:auto"> Bu cevabı SSS'ye de ekle
      <input id="qc${q.id}" placeholder="SSS kategorisi" style="max-width:160px">
    </label>
    <button class="ok" onclick="answer(${q.id})">Cevabı gönder</button>
  </div>`;
}

async function load() {
  let d;
  try { d = await api("/admin/queue"); } catch (e) { return loginScreen(); }
  document.title = `(${d.apps.length + d.questions.length}) Komisyon Paneli`;
  $("root").innerHTML = `
    <header>
      <h1>Komisyon Paneli</h1>
      <span class="stats">düzeltme bekleyen: ${d.stats.fix} · kabul edilen staj: ${d.stats.accepted} ·
        <a href="#" onclick="load();return false">yenile</a> ·
        <a href="#" onclick="api('/admin/logout',{method:'POST'}).then(()=>loginScreen());return false">çıkış</a><br>
        <span style="font-size:12px">son güncelleme: ${new Date().toLocaleTimeString("tr-TR")} — 30 sn'de bir kendini yeniler</span></span>
    </header>
    <h2>Bekleyen işler (${d.apps.length})</h2>
    ${d.apps.length ? d.apps.map(appCard).join("") : `<div class="empty">Bekleyen iş yok 👍</div>`}
    <h2>Öğrenci soruları (${d.questions.length})</h2>
    ${d.questions.length ? d.questions.map(qCard).join("") : `<div class="empty">Cevap bekleyen soru yok.</div>`}
    <h2>Başlangıcı yaklaşan stajlar — 14 gün (${d.upcoming.length})</h2>
    ${d.upcoming.length ? d.upcoming.map(u => `<div class="card">
      <span class="who">${u.name}</span> <span class="meta">· ${u.ogrenci_no} · ${u.kurum_adi || "—"}</span>
      <div class="meta">Başlangıç: <b>${u.start_date}</b> ·
        SGK kontrolü: ${u.sgk_checked ? "✅ öğrenci doğruladı" : "⏳ bekleniyor"} ·
        OBS: ${u.obs_done ? "✅" : "⏳"}</div></div>`).join("")
      : `<div class="empty">14 gün içinde başlayacak staj yok.</div>`}
    <h2>Öğrenciden düzeltme beklenenler (${d.waitingFix.length})</h2>
    ${d.waitingFix.length ? d.waitingFix.map(w => `<div class="card">
      <span class="who">${w.name}</span> <span class="meta">· ${w.ogrenci_no} ·
      ${w.status === "fix_defter" ? "defter düzeltmesi" : "belge düzeltmesi"} · istendi: ${(w.updated_at || "").slice(0, 10)}</span>
      <div class="meta">“${w.fix_note || ""}”</div></div>`).join("")
      : `<div class="empty">Düzeltme bekleyen öğrenci yok.</div>`}
    <h2>Öğrenci yönetimi</h2>
    <div class="card" id="stuCard">
      <div class="meta" id="stuStats">yükleniyor…</div>
      <p style="margin:8px 0 4px;font-size:14px">Yeni öğrencileri toplu ekle — her satıra bir öğrenci:</p>
      <div class="meta">biçim: <code>öğrenciNo;TCkimlikNo;Ad Soyad;eposta;sınıf</code> (e-posta ve sınıf isteğe bağlı; sınıf 2-4, boşsa 3 kabul edilir — 2. sınıf tek staj başvurusu yapabilir)</div>
      <textarea id="stuLines" rows="4" placeholder="202512345678;12345678901;Ali Veli;ali@ogr.balikesir.edu.tr;3"></textarea>
      <button class="ok" onclick="addStudents()">Öğrencileri ekle</button>
      <div class="meta" id="stuRes"></div>
      <div class="meta" style="margin-top:6px">Eklenen öğrenci ilk girişini <b>öğrenci no + TC</b> ile yapar ve kendi şifresini oluşturur.</div>
    </div>`;
  loadStudents();
  document.querySelectorAll("select[id^=t]").forEach(sel => {
    sel.onchange = () => { const id = sel.id.slice(1); if (sel.value !== "") $("n" + id).value = TEMPLATES[+sel.value]; };
  });
}

async function loadStudents() {
  try {
    const s = await api("/admin/students");
    $("stuStats").textContent = `Kayıtlı öğrenci: ${s.count} · şifresini oluşturmuş (aktif): ${s.activated}`;
  } catch {}
}
async function addStudents() {
  try {
    const r = await api("/admin/students", { method: "POST", json: { lines: $("stuLines").value } });
    $("stuRes").innerHTML = `✅ ${r.added} eklendi${r.skipped ? ` · ${r.skipped} zaten kayıtlı` : ""}` +
      (r.errors.length ? `<br>⚠ ${r.errors.join(" · ")}` : "");
    if (r.added) { $("stuLines").value = ""; loadStudents(); }
  } catch (e) { $("stuRes").textContent = "⚠ " + e.message; }
}

async function decide(id, action) {
  const note = $("n" + id)?.value || "";
  try {
    await api(`/admin/app/${id}/decision`, { method: "POST", json: { action, note } });
    load();
  } catch (e) { alert(e.message); }
}
async function act(path, json) { try { await api(path, { method: "POST", json }); load(); } catch (e) { alert(e.message); } }
async function answer(id) {
  try {
    await api(`/admin/question/${id}/answer`, { method: "POST",
      json: { answer: $("qa" + id).value, addToFaq: $("qf" + id).checked, category: $("qc" + id).value } });
    load();
  } catch (e) { alert(e.message); }
}

load();
// Sayfa açıkken yeni başvurular kendiliğinden görünsün: 30 saniyede bir yenile.
// Bir kartta yazı yazılıyorsa (odak formda ise) yenileme o turu atlar.
setInterval(() => {
  const a = document.activeElement;
  if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT" || a.tagName === "SELECT")) return;
  if (document.querySelector(".login")) return;
  load();
}, 30000);
</script>
</body>
</html>
