<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAÜN Staj</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<style>
  :root{
    --navy:#16305f; --accent:#1d4ed8; --accent-h:#1941ae;
    --ink:#1c2536; --mut:#5d6675; --line:#e2e6ee; --bg:#f3f5f9; --card:#ffffff;
    --ok:#187a3c; --warn:#b45309;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);
       color:var(--ink);font-size:16px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
  .frame{display:flex;flex-direction:column;flex:1}

  /* ── Üst bant: kurumsal lacivert ── */
  header{background:var(--navy)}
  .hwrap{max-width:1200px;margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:26px;height:64px}
  .logo{color:#fff;font-weight:700;font-size:17.5px;line-height:1.2;white-space:nowrap}
  .logo small{display:block;font-weight:400;font-size:12px;color:#aebbdd;letter-spacing:.02em}
  nav{display:flex;gap:4px;flex:1;justify-content:center}
  nav a{padding:8px 18px;color:#d5def5;text-decoration:none;cursor:pointer;font-size:15px;border-radius:8px;font-weight:500}
  nav a:hover{background:rgba(255,255,255,.12);color:#fff}
  nav a.active{background:#fff;color:var(--navy);font-weight:700}
  header .muted{color:#aebbdd;font-size:14px}
  header .link{color:#fff;font-size:13.5px}

  /* ── Sayfa gövdesi ── */
  main{width:100%;max-width:780px;margin:36px auto;padding:44px 52px;background:var(--card);
       border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(22,48,95,.06)}
  main.wide{max-width:1200px;background:transparent;border:0;box-shadow:none;padding:32px 28px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
  .colmain{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:40px 48px;
           box-shadow:0 1px 2px rgba(22,48,95,.06);border-top:4px solid var(--accent)}
  .colmain.tone-warn{border-top-color:#d97706}
  .colmain.tone-ok{border-top-color:#16a34a}
  .sidecard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;
            margin-bottom:16px;font-size:14.5px;box-shadow:0 1px 2px rgba(22,48,95,.05)}
  .sidecard h4{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
  .eyeb{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
  .steps-v{list-style:none}
  .steps-v li{padding:5px 0 5px 26px;position:relative;font-size:14.5px;color:#9aa3b2}
  .steps-v li::before{content:"·";position:absolute;left:7px}
  .steps-v li.done{color:var(--ok)} .steps-v li.done::before{content:"✓";left:3px}
  .steps-v li.now{color:var(--accent);font-weight:700} .steps-v li.now::before{content:"→";left:0}
  .m-only{display:none}

  /* ── Tipografi ── */
  h1{font-size:25px;line-height:1.3;margin-bottom:8px;letter-spacing:-.2px}
  .sub{color:var(--mut);margin-bottom:22px;font-size:16px}
  label{display:block;margin-top:16px;font-weight:600;font-size:15px}
  .hint{font-size:14px;color:var(--mut);margin-top:4px}
  .muted{color:var(--mut);font-size:14.5px}
  .after{font-size:14.5px;color:var(--mut);margin-top:8px}
  .center .after{text-align:center}
  .why{font-size:14.5px;color:var(--warn);margin-top:6px;min-height:18px}
  .link{color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:none;
        font-size:inherit;font-family:inherit;padding:0}

  /* ── Butonlar: normal boyutlu, hizalı ── */
  .big{display:inline-block;border:0;background:var(--accent);color:#fff;padding:13px 32px;min-width:250px;
       font-size:15.5px;font-weight:600;border-radius:10px;cursor:pointer;font-family:inherit;
       margin:10px 8px 4px 0;transition:background .15s;text-align:center}
  .big:hover:not(:disabled){background:var(--accent-h)}
  .big:disabled{background:#c3cbd8;cursor:not-allowed}
  .quiet{display:inline-block;border:1.5px solid #cfd6e1;background:#fff;color:#3c4453;padding:12px 26px;
         min-width:180px;font-size:15px;border-radius:10px;cursor:pointer;font-family:inherit;
         margin:8px 8px 4px 0;text-align:center;transition:border-color .15s}
  .quiet:hover{border-color:var(--accent);color:var(--accent)}
  .center .big{display:block;margin-left:auto;margin-right:auto}

  /* ── Form öğeleri ── */
  input,select,textarea{width:100%;max-width:560px;display:block;padding:12px 14px;border:1.5px solid #cfd6e1;
    font-size:15.5px;font-family:inherit;margin:6px 0 2px;border-radius:10px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
  .radio{display:flex;align-items:center;gap:12px;border:1.5px solid #cfd6e1;padding:14px 16px;max-width:560px;
         margin:10px 0;cursor:pointer;border-radius:11px;font-size:15.5px;background:#fff}
  .radio:hover{border-color:var(--accent)}
  .radio:has(input:checked){border-color:var(--accent);background:#eef3ff}
  .radio input{width:19px;height:19px;accent-color:var(--accent);flex-shrink:0}

  /* ── Süreç çubuğu ── */
  .prog{margin:0 0 24px}
  .prog .bar{height:6px;background:#e4e8ef;border-radius:3px;overflow:hidden}
  .prog .bar i{display:block;height:100%;background:#16a34a}
  .prog .bar i.blue{background:var(--accent)}
  .prog .txt{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mut);margin-top:6px}
  .prog details{margin-top:6px;font-size:14px}
  .prog summary{cursor:pointer;color:var(--accent);list-style:none}
  .prog li{list-style:none;padding:3px 0;color:#9aa3b2}
  .prog li.done{color:var(--ok)}
  .prog li.now{color:var(--ink);font-weight:600}

  /* ── Bilgi kutuları ── */
  .box{border-radius:11px;padding:15px 18px;margin:14px 0;font-size:15px;border:1px solid var(--line);background:#f7f8fb}
  .box.warn{background:#fdf6e3;border-color:#f0dca4}
  .box.ok{background:#ecf7ef;border-color:#bfe3c9}
  .box.info{background:#f2f5fb;border-color:#dbe3f2}
  .box.err{background:#fdeeee;border-color:#f2c4c4}
  .upload{border:2px dashed #c6cedb;padding:26px;text-align:center;color:var(--mut);margin:14px 0;
          cursor:pointer;border-radius:11px;font-size:15px;background:#fafbfd;transition:border-color .15s}
  .upload:hover{border-color:var(--accent)}
  .upload.done{border-style:solid;border-color:#16a34a;color:#166534;background:#f0fdf4}
  .check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f0f2f6;
         cursor:pointer;font-size:15.5px}
  .check input{width:21px;height:21px;margin-top:2px;accent-color:#16a34a;flex-shrink:0}

  /* ── Belge kartları ── */
  .doc{border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:10px 0;background:#fff}
  .doc-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .doc-ad{font-weight:700;font-size:16px}
  .doc-indir{flex-shrink:0;background:var(--accent);color:#fff;font-weight:600;font-size:14px;
             padding:8px 20px;border-radius:9px;text-decoration:none;transition:background .15s}
  .doc-indir:hover{background:var(--accent-h)}
  .doc-sum{font-size:14.5px;color:#4a5262;margin-top:5px}
  .doc-det{margin-top:8px}
  .doc-det summary{cursor:pointer;color:var(--accent);font-size:14px}
  .doc-det table{border-collapse:collapse;margin-top:8px;font-size:14px}
  .doc-det td{padding:5px 12px 5px 0;vertical-align:top}
  .doc-det td:first-child{font-weight:600;white-space:nowrap}

  /* ── SSS / listeler ── */
  .qa{border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:10px 0;background:#fff}
  .qa .q{font-weight:600;cursor:pointer;font-size:15.5px}
  .qa .a{display:none;margin-top:8px;color:#4a5262;font-size:14.5px}
  .qa.open .a{display:block}
  .center{text-align:center}
  .icon{font-size:42px;margin-bottom:10px}
  .notif{background:#eef3ff;border:1px solid #dbe3f2;border-radius:10px;padding:10px 14px;font-size:14px;margin:6px 0}
  .backrow{margin-bottom:14px}
  .backrow .link{text-decoration:none;font-size:14.5px}

  footer{border-top:1px solid var(--line);background:#fff;margin-top:auto}
  .fwrap{max-width:1200px;margin:0 auto;padding:14px 28px;font-size:13px;color:#8b93a2;
         display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}

  /* ── Duyarlılık ── */
  @media (max-width:960px){
    .cols{grid-template-columns:1fr}
    .m-only{display:block}
    nav{justify-content:flex-start}
  }
  @media (max-width:700px){
    main,main.wide{margin:0;border:0;border-radius:0;padding:28px 20px;flex:1;background:#fff}
    .colmain{border:0;padding:0;box-shadow:none}
    .big,.quiet{display:block;width:100%;min-width:0}
    .logo small{display:none}
    .hwrap{padding:0 14px;height:56px;gap:10px}
    nav a{padding:7px 12px;font-size:14px}
  }
</style>
</head>
<body>
<div class="frame">
  <header id="topbar" style="display:none">
    <div class="hwrap">
      <span class="logo">BAÜN Staj Portalı<small>Bilgisayar Mühendisliği Bölümü</small></span>
      <nav>
        <a data-nav="home" onclick="go('home')">Stajım</a>
        <a data-nav="docs" onclick="go('docs')">Belgelerim</a>
        <a data-nav="help" onclick="go('help')">Yardım</a>
        <a data-nav="guide" onclick="go('guide')">Rehber</a>
      </nav>
      <span style="display:flex;align-items:center;gap:12px">
        <span id="uname" class="muted" style="font-size:13.5px"></span>
        <button class="link" style="font-size:13px" onclick="logout()">Çıkış</button>
      </span>
    </div>
  </header>
  <main id="app"></main>
  <footer><div class="fwrap"><span>Balıkesir Üniversitesi · Bilgisayar Mühendisliği — Staj Portalı</span><span>pilot sürüm</span></div></footer>
</div>
<script src="app.js"></script>
</body>
</html>
