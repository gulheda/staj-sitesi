<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAÜN Staj</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #eef0f4; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #eef0f4; color: #1f2328; line-height: 1.55; font-size: 17px;
         min-height: 100vh; display: flex; flex-direction: column; }
  .frame { display: flex; flex-direction: column; flex: 1; }
  header { background: #fff; border-bottom: 1px solid #e5e7eb; }
  .hwrap { max-width: 960px; margin: 0 auto; padding: 14px 24px; display: flex;
           justify-content: space-between; align-items: center; gap: 12px; }
  header .logo { font-weight: 700; font-size: 16px; color: #1e3a8a; }
  header .logo small { display: block; font-weight: 400; font-size: 12px; color: #6b7280; letter-spacing: .02em; }
  nav { display: flex; gap: 4px; }
  nav a { padding: 8px 16px; color: #4b5563; text-decoration: none; cursor: pointer; font-size: 15px; border-radius: 9px; }
  nav a.active { background: #eef2ff; color: #1e40af; font-weight: 600; }
  main { width: 100%; max-width: 640px; margin: 36px auto; padding: 42px 46px; background: #fff;
         border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 1px 3px rgba(15,23,42,.05); }
  @media (max-width: 700px) {
    main { margin: 0; border: 0; border-radius: 0; padding: 32px 24px; flex: 1; }
    header .logo small { display: none; }
    .hwrap { padding: 12px 16px; }
  }
  h1 { font-size: 27px; line-height: 1.25; margin-bottom: 10px; letter-spacing: -.2px; }
  .sub { color: #6b7280; margin-bottom: 26px; font-size: 17px; }
  .big { display: block; width: 100%; border: 0; background: #1d4ed8; color: #fff; padding: 16px;
         font-size: 18px; font-weight: 600; border-radius: 12px; cursor: pointer; font-family: inherit; margin: 8px 0 6px; }
  .big:disabled { background: #cbd5e1; cursor: not-allowed; }
  .quiet { display: block; width: 100%; border: 1.5px solid #d1d5db; background: #fff; color: #374151;
           padding: 13px; font-size: 16px; border-radius: 12px; cursor: pointer; font-family: inherit; margin: 6px 0; }
  .after { font-size: 14.5px; color: #6b7280; text-align: center; margin-top: 8px; }
  .link { color: #1d4ed8; cursor: pointer; text-decoration: underline; background: none; border: none;
          font-size: inherit; font-family: inherit; padding: 0; }
  .muted { color: #6b7280; font-size: 14.5px; }
  input, select, textarea { width: 100%; padding: 13px; border: 1.5px solid #d1d5db; font-size: 17px;
    font-family: inherit; margin: 6px 0 2px; border-radius: 10px; background: #fff; }
  label { display: block; margin-top: 18px; font-weight: 600; font-size: 15.5px; }
  .hint { font-size: 14px; color: #6b7280; margin-top: 4px; }
  .radio { display: flex; align-items: center; gap: 12px; border: 1.5px solid #d1d5db; padding: 15px;
           margin: 10px 0; cursor: pointer; border-radius: 12px; font-size: 17px; background: #fff; }
  .radio:hover { border-color: #1d4ed8; }
  .radio:has(input:checked) { border-color: #1d4ed8; background: #eff6ff; }
  .radio input { width: 20px; height: 20px; accent-color: #1d4ed8; flex-shrink: 0; }
  .prog { margin: 0 0 26px; }
  .prog .bar { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
  .prog .bar i { display: block; height: 100%; background: #16a34a; }
  .prog .bar i.blue { background: #1d4ed8; }
  .prog .txt { display: flex; justify-content: space-between; font-size: 13.5px; color: #6b7280; margin-top: 6px; }
  .prog details { margin-top: 6px; font-size: 14px; }
  .prog summary { cursor: pointer; color: #1d4ed8; list-style: none; }
  .prog li { list-style: none; padding: 3px 0; color: #9ca3af; }
  .prog li.done { color: #16a34a; }
  .prog li.now { color: #1f2328; font-weight: 600; }
  .box { border-radius: 12px; padding: 16px 18px; margin: 18px 0; font-size: 15.5px; }
  .box.warn { background: #fef9c3; border: 1px solid #fde047; }
  .box.ok   { background: #dcfce7; border: 1px solid #86efac; }
  .box.info { background: #f3f4f6; }
  .box.err  { background: #fee2e2; border: 1px solid #fca5a5; }
  .upload { border: 2px dashed #cbd5e1; padding: 26px; text-align: center; color: #6b7280; margin: 14px 0;
            cursor: pointer; border-radius: 12px; font-size: 15.5px; background: #fafafa; }
  .upload.done { border-style: solid; border-color: #16a34a; color: #166534; background: #f0fdf4; }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #f3f4f6;
           cursor: pointer; font-size: 16px; }
  .check input { width: 22px; height: 22px; margin-top: 2px; accent-color: #16a34a; flex-shrink: 0; }
  .qa { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 18px; margin: 10px 0; }
  .qa .q { font-weight: 600; cursor: pointer; font-size: 16px; }
  .qa .a { display: none; margin-top: 8px; color: #4b5563; font-size: 15.5px; }
  .qa.open .a { display: block; }
  .center { text-align: center; }
  .icon { font-size: 44px; margin-bottom: 12px; }
  .backrow { margin-bottom: 14px; }
  .backrow .link { text-decoration: none; font-size: 15px; }
  .notif { background: #eef2ff; border-radius: 10px; padding: 10px 14px; font-size: 14px; margin: 6px 0; }
  footer { border-top: 1px solid #e5e7eb; background: #fff; margin-top: auto; }
  .fwrap { max-width: 960px; margin: 0 auto; padding: 12px 24px; font-size: 12.5px; color: #9ca3af;
           display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
</style>
</head>
<body>
<div class="frame">
  <header id="topbar" style="display:none">
    <div class="hwrap">
      <span class="logo">BAÜN Staj Portalı<small>Bilgisayar Mühendisliği Bölümü</small></span>
      <nav>
        <a data-nav="home" onclick="go('home')">Stajım</a>
        <a data-nav="docs" onclick="go('docs')">Belgelerim</a>
        <a data-nav="help" onclick="go('help')">Yardım</a>
        <a data-nav="guide" onclick="go('guide')">Rehber</a>
      </nav>
      <button class="link" style="font-size:13px" onclick="logout()">Çıkış</button>
    </div>
  </header>
  <main id="app"></main>
  <footer><div class="fwrap"><span>Balıkesir Üniversitesi · Bilgisayar Mühendisliği — Staj Portalı</span><span>pilot sürüm</span></div></footer>
</div>
<script src="app.js"></script>
</body>
</html>
