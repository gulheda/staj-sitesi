<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAÜN Staj Portalı — Prototip</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #f3f4f6; color: #1f2328; line-height: 1.55; font-size: 17px; }
  .frame { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: #fff; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px;
           border-bottom: 1px solid #e5e7eb; }
  header .logo { font-weight: 700; font-size: 15px; color: #374151; }
  nav { display: flex; gap: 4px; }
  nav a { padding: 6px 12px; color: #4b5563; text-decoration: none; cursor: pointer; font-size: 15px; border-radius: 8px; }
  nav a.active { background: #eef2ff; color: #1e40af; font-weight: 600; }
  main { padding: 36px 26px 30px; flex: 1; }
  h1 { font-size: 27px; line-height: 1.25; margin-bottom: 10px; letter-spacing: -.2px; }
  .sub { color: #6b7280; margin-bottom: 26px; font-size: 17px; }
  .big { display: block; width: 100%; border: 0; background: #1d4ed8; color: #fff; padding: 16px;
         font-size: 18px; font-weight: 600; border-radius: 12px; cursor: pointer; font-family: inherit; margin: 8px 0 6px; }
  .big:disabled { background: #cbd5e1; cursor: not-allowed; }
  .quiet { display: block; width: 100%; border: 1.5px solid #d1d5db; background: #fff; color: #374151;
           padding: 13px; font-size: 16px; border-radius: 12px; cursor: pointer; font-family: inherit; margin: 6px 0; }
  .after { font-size: 14.5px; color: #6b7280; text-align: center; margin-top: 8px; }
  .link { color: #1d4ed8; cursor: pointer; text-decoration: underline; background: none; border: none;
          font-size: inherit; font-family: inherit; padding: 0; }
  .muted { color: #6b7280; font-size: 14.5px; }
  input[type=text], input[type=password], input[type=date], select, textarea {
    width: 100%; padding: 13px; border: 1.5px solid #d1d5db; font-size: 17px;
    font-family: inherit; margin: 6px 0 2px; border-radius: 10px; background: #fff; }
  label { display: block; margin-top: 18px; font-weight: 600; font-size: 15.5px; }
  .hint { font-size: 14px; color: #6b7280; margin-top: 4px; }
  .radio { display: flex; align-items: center; gap: 12px; border: 1.5px solid #d1d5db; padding: 15px;
           margin: 10px 0; cursor: pointer; border-radius: 12px; font-size: 17px; background: #fff; }
  .radio:hover { border-color: #1d4ed8; }
  .radio input { width: 20px; height: 20px; accent-color: #1d4ed8; }
  /* sade ilerleme: ince çubuk + tek satır */
  .prog { margin: 0 0 26px; }
  .prog .bar { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
  .prog .bar i { display: block; height: 100%; background: #16a34a; }
  .prog .txt { display: flex; justify-content: space-between; font-size: 13.5px; color: #6b7280; margin-top: 6px; }
  .prog details { margin-top: 6px; font-size: 14px; }
  .prog summary { cursor: pointer; color: #1d4ed8; list-style: none; }
  .prog li { list-style: none; padding: 3px 0; color: #9ca3af; }
  .prog li.done { color: #16a34a; }
  .prog li.now { color: #1f2328; font-weight: 600; }
  .box { border-radius: 12px; padding: 16px 18px; margin: 18px 0; font-size: 15.5px; }
  .box.warn { background: #fef9c3; border: 1px solid #fde047; }
  .box.ok   { background: #dcfce7; border: 1px solid #86efac; }
  .box.info { background: #f3f4f6; }
  .upload { border: 2px dashed #cbd5e1; padding: 26px; text-align: center; color: #6b7280; margin: 14px 0;
            cursor: pointer; border-radius: 12px; font-size: 15.5px; background: #fafafa; }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #f3f4f6;
           cursor: pointer; font-size: 16px; }
  .check input { width: 22px; height: 22px; margin-top: 2px; accent-color: #16a34a; flex-shrink: 0; }
  .qa { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 18px; margin: 10px 0; }
  .qa .q { font-weight: 600; cursor: pointer; font-size: 16px; }
  .qa .a { display: none; margin-top: 8px; color: #4b5563; font-size: 15.5px; }
  .qa.open .a { display: block; }
  .center { text-align: center; }
  .icon { font-size: 44px; margin-bottom: 12px; }
  footer { border-top: 1px solid #e5e7eb; padding: 10px 22px; font-size: 12.5px; color: #9ca3af;
           display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  footer select { font-size: 12px; padding: 3px; max-width: 200px; border-radius: 6px; border: 1px solid #d1d5db; }
  .backrow { margin-bottom: 14px; }
  .backrow .link { text-decoration: none; font-size: 15px; }
</style>
</head>
<body>
<div class="frame">
  <header id="topbar" style="display:none">
    <span class="logo">BAÜN Staj</span>
    <nav>
      <a data-nav="home" onclick="go('home')">Stajım</a>
      <a data-nav="docs" onclick="go('docs')">Belgelerim</a>
      <a data-nav="help" onclick="go('help')">Yardım</a>
    </nav>
  </header>
  <main id="app"></main>
  <footer>
    <span>Prototip — akış testi içindir</span>
    <span>Senaryo:
      <select id="scenario" onchange="setScenario(this.value)">
        <option value="">— seç —</option>
        <option value="fresh">İlk kez giren öğrenci</option>
        <option value="noplace">Staj yeri henüz yok</option>
        <option value="draft">Başvurusu yarım kalmış</option>
        <option value="review">Başvurusu incelemede</option>
        <option value="fix">Düzeltme istenmiş</option>
        <option value="approved">Onaylanmış (SGK aşaması)</option>
        <option value="during">Stajı devam ediyor</option>
        <option value="deliver">Defter teslim aşamasında</option>
        <option value="evaluating">Defteri değerlendirmede</option>
        <option value="accepted">Stajı kabul edilmiş</option>
      </select>
    </span>
  </footer>
</div>

<script>
/* Öğrencinin süreçteki yeri tek değişkendir; her ekran buna göre çizilir. */
const STAGES = ["Staj yeri bulma","Belgeleri hazırlama","Başvuru","Komisyon incelemesi","Onay",
                "SGK kontrolü","OBS kaydı","Staj","Defter hazırlama","Teslim","Değerlendirme","Tamamlandı"];

let student = { stage: "fresh", wizardStep: 1, dates: null, sicil: false };

function setScenario(s){ if(!s) return; student.stage = s; student.wizardStep = (s==="draft") ? 4 : 1;
  student.sicil = false; go("home"); }

function nav(active){
  document.getElementById("topbar").style.display = "flex";
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("active", a.dataset.nav===active));
}

/* Sade ilerleme: ince yeşil çubuk + "Adım 6/12". Ayrıntı isteyen açar. */
function prog(now){
  const pct = Math.round(now/STAGES.length*100);
  return `<div class="prog">
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="txt"><span>Adım ${now}/12 · ${STAGES[now] ?? "Bitti"}</span><span>%${pct}</span></div>
    <details><summary>Tüm adımları gör</summary><ul>
      ${STAGES.map((s,i)=>`<li class="${i<now?'done':(i===now?'now':'')}">${i<now?'✓':(i===now?'→':'·')} ${s}</li>`).join('')}
    </ul></details>
  </div>`;
}

function render(html, activeNav){
  document.getElementById("app").innerHTML = html;
  if(activeNav) nav(activeNav);
  window.scrollTo(0,0);
}
const back = `<div class="backrow"><button class="link" onclick="go('home')">← Stajıma dön</button></div>`;

const screens = {

login(){
  document.getElementById("topbar").style.display = "none";
  document.getElementById("app").innerHTML = `
    <div style="margin-top:40px">
      <h1>BAÜN Staj</h1>
      <p class="sub">Stajınla ilgili her şey burada.</p>
      <label>Öğrenci numaran</label>
      <input type="text" placeholder="20251001234">
      <label>Şifren</label>
      <input type="password" placeholder="••••••••">
      <p class="hint">İlk kez mi giriyorsun? Şifre yerine TC kimlik numaranı yaz — sonra kendi şifreni oluşturacaksın.</p>
      <br><button class="big" onclick="go('onboard')">Giriş yap</button>
      <p class="center"><button class="link" style="font-size:14px">Şifremi unuttum</button></p>
    </div>`;
},

onboard(){
  render(`
    <h1>Hoş geldin 👋</h1>
    <p class="sub">Sana doğru adımı gösterebilmemiz için tek bir soru:</p>
    <p style="font-weight:600;margin-bottom:6px">Şu anda hangi durumdasın?</p>
    <label class="radio"><input type="radio" name="st" onclick="pick('noplace')"> İlk kez staj başvurusu yapacağım</label>
    <label class="radio"><input type="radio" name="st" onclick="pick('review')"> Daha önce başvuru yaptım</label>
    <label class="radio"><input type="radio" name="st" onclick="pick('during')"> Stajım başladı</label>
    <label class="radio"><input type="radio" name="st" onclick="pick('deliver')"> Stajımı tamamladım</label>
    <button class="big" id="cont" disabled onclick="go('home')">Devam et</button>
  `, "home");
},

home(){
  const s = student.stage;
  if(s==="fresh"){ screens.onboard(); return; }
  let h = "";

  if(s==="noplace") h = `
    ${prog(0)}
    <h1>Önce staj yapacağın bir kurum bul.</h1>
    <p class="sub">Kurumda bilgisayar ya da yazılım alanında çalışan bir mühendis olmalı — tek şart bu.</p>
    <div class="box info">Emin değilsen kuruma şunu sor:<br><i>“Staj süresince benden sorumlu olacak mühendisin unvanı nedir?”</i></div>
    <button class="big" onclick="go('accept')">Kurum buldum</button>
    <p class="after">Sonraki adım: kurumun imzalayacağı belgeyi birlikte hazırlayacağız.</p>`;

  if(s==="draft") h = `
    ${prog(2)}
    <h1>Başvurun yarım kaldı.</h1>
    <p class="sub">Bilgilerin kaydedildi — kaldığın yerden devam edebilirsin.</p>
    <button class="big" onclick="go('wizard')">Devam et (Adım ${student.wizardStep}/7)</button>`;

  if(s==="review") h = `
    ${prog(3)}
    <h1>Başvurun inceleniyor.</h1>
    <p class="sub">Senden bir işlem beklenmiyor. Sonuçlanınca e-posta ile haber vereceğiz.</p>
    <div class="box info">Başvurular genellikle 5 iş günü içinde incelenir.</div>`;

  if(s==="fix") h = `
    ${prog(3)}
    <h1>Bir belgeyi düzeltmen gerekiyor.</h1>
    <p class="sub">Komisyonun notu:</p>
    <div class="box warn"><b>Kabul belgende işletme kaşesi görünmüyor.</b><br>
    Belgeyi işletmeye kaşelettikten sonra yeniden yükle.</div>
    <div class="upload" onclick="uploaded(this)">Belgeyi buraya sürükle veya <u>dosya seç</u></div>
    <button class="big" onclick="fixDone()">Belgeyi gönder</button>
    <p class="after">Yeni belgen doğrudan komisyona gidecek.</p>`;

  if(s==="approved") h = `
    ${prog(5)}
    <h1>Başvurun onaylandı ✓</h1>
    <p class="sub">Stajın <b>8 gün sonra</b> başlıyor. Başlamadan önce tek bir işin var:</p>
    <div class="box info"><b>Sigorta (SGK) girişini kontrol et.</b><br>
    Sigortanı üniversite yapar — sen sadece yapılmış mı diye bakacaksın. 2 dakika sürer.</div>
    <button class="big" onclick="go('sgk')">Nasıl bakacağımı göster</button>`;

  if(s==="during") h = `
    ${prog(7)}
    <h1>Stajın devam ediyor.</h1>
    <p class="sub">7. gün / 20 gün · Bitiş: 31 Temmuz</p>
    <div class="box warn"><b>Her gün defter sayfanı doldur ve imzalat.</b> Son güne bırakma — en çok yapılan hata bu.</div>
    <button class="big" onclick="go('docs')">Defter sayfasını indir</button>
    <button class="quiet" onclick="go('docs')">Vlog rehberi</button>`;

  if(s==="deliver") h = `
    ${prog(9)}
    <h1>Stajın bitti 🎉</h1>
    <p class="sub">Son iki işin kaldı. Son tarih: <b>15 Ekim</b></p>
    <div class="box info"><b>1.</b> Staj defterini buradan yükle<br>
    <b>2.</b> Sicil fişini kapalı zarfla bölüm sekreterliğine elden götür</div>
    <button class="big" onclick="go('deliverCheck')">Defteri yüklemeye başla</button>`;

  if(s==="evaluating") h = `
    ${prog(10)}
    <h1>Defterin değerlendiriliyor.</h1>
    <p class="sub">Senden bir işlem beklenmiyor. Sonuç açıklanınca haber vereceğiz.</p>
    ${student.sicil ? '<div class="box ok">✓ Sicil fişin bölüme ulaştı. Her şey tamam.</div>'
                    : '<div class="box warn">Sicil fişini henüz götürmediysen unutma: kapalı zarfla bölüm sekreterliğine.</div>'}`;

  if(s==="accepted") h = `
    ${prog(12)}
    <div class="center"><div class="icon">🎓</div></div>
    <h1 class="center">Stajın kabul edildi!</h1>
    <p class="sub center">Her şey tamamlandı. Yapman gereken başka bir şey yok.</p>
    <div class="box info center">Staj notun OBS'ye işlenince orada görünecek.</div>`;

  render(h, "home");
},

accept(){
  render(`
    ${back}
    <h1>Kuruma bu belgeyi imzalat.</h1>
    <p class="sub">Yaz stajı yapacağın için doğru formu senin yerine seçtik.</p>
    <div class="box info"><b>Staj kabul belgesi</b> <span class="muted">(resmî adı: EK-1)</span><br><br>
      • Üst kısmını sen dolduracaksın<br>
      • Kurum yetkilisi <b>imzalayacak</b> ve <b>kaşeleyecek</b><br>
      • İkisi de yoksa komisyon belgeyi geri gönderir</div>
    <button class="big">Belgeyi indir</button>
    <button class="quiet">Örnek doldurulmuş belgeyi gör</button>
    <button class="quiet" onclick="student.stage='draft';student.wizardStep=1;go('wizard')">İmzalattım, başvuruya geç →</button>
  `, "home");
},

/* 7 adımlı sihirbaz — her ekranda tek soru */
wizard(){
  const n = student.wizardStep;
  const names = ["Bilgilerin","Staj türün","Kurum","Sorumlu mühendis","Tarihler","Belge","Kontrol"];
  const head = `
    <div class="prog"><div class="bar"><i style="width:${Math.round(n/7*100)}%;background:#1d4ed8"></i></div>
    <div class="txt"><span>Adım ${n}/7 · ${names[n-1]}</span></div></div>`;
  const backB = n>1 ? `<button class="quiet" onclick="student.wizardStep--;go('wizard')">← Geri</button>`
                    : `<button class="quiet" onclick="go('home')">← Çık (bilgilerin kaydedilir)</button>`;
  const next = ()=>`<button class="big" onclick="student.wizardStep++;go('wizard')">Devam et</button>`;
  let body = "";

  if(n===1) body = `
    <h1>Bilgilerini kontrol et.</h1>
    <p class="sub">Bunlar öğrenci kayıtlarından geldi — yazmana gerek yok.</p>
    <div class="box info">Deniz Yılmaz · 20251001234<br>3. sınıf, Bilgisayar Mühendisliği</div>
    <label>Telefon numaran</label><input type="text" placeholder="05xx xxx xx xx">
    <p class="hint">Komisyonun sana ulaşması gerekirse kullanılır.</p>
    ${next()}${backB}`;

  if(n===2) body = `
    <h1>Stajını ne zaman yapacaksın?</h1>
    <label class="radio"><input type="radio" name="t" checked> Yaz tatilinde</label>
    <label class="radio"><input type="radio" name="t"> Dönem içinde</label>
    <p class="hint">Cevabına göre doğru belgeleri ve kuralları biz ayarlarız.</p>
    ${next()}${backB}`;

  if(n===3) body = `
    <h1>Staj yapacağın kurum</h1>
    <label>Kurumun adı</label><input type="text" placeholder="Örnek Yazılım A.Ş.">
    <label>Şehir</label><input type="text" placeholder="Balıkesir">
    <label>Ne iş yapıyor?</label><input type="text" placeholder="Yazılım geliştirme">
    ${next()}${backB}`;

  if(n===4) body = `
    <h1>Senden sorumlu mühendis kim?</h1>
    <label>Adı soyadı</label><input type="text">
    <label>Unvanı</label>
    <select onchange="document.getElementById('dk').style.display = this.value==='?' ? 'block':'none'">
      <option>Bilgisayar Mühendisi</option><option>Yazılım Mühendisi</option>
      <option>İlgili alanda mühendis</option><option value="?">Bilmiyorum</option>
    </select>
    <div id="dk" style="display:none" class="box info">Sorun değil — kuruma şunu sor:<br>
      <i>“Staj süresince benden sorumlu olacak mühendisin adı ve unvanı nedir?”</i><br>
      Cevabı alınca dönüp devam edersin; bilgilerin kaydedildi.</div>
    ${next()}${backB}`;

  if(n===5){
    const fixed = student.dates === "ok";
    body = `
    <h1>Staj tarihlerini seç.</h1>
    <p class="sub">İş günü hesabını biz yaparız — sen sadece tarihleri seç.</p>
    <label>Başlangıç</label><input type="date" value="2026-07-06" disabled>
    <label>Bitiş</label><input type="date" value="${fixed?'2026-08-03':'2026-07-31'}" disabled>
    ${fixed
      ? `<div class="box ok">✓ 20 iş günü — kurala uygun.</div>${next()}`
      : `<div class="box warn">Bu tarihler <b>19 iş günü</b> ediyor; en az <b>20</b> olmalı.<br><br>
         <button class="big" style="background:#b45309" onclick="student.dates='ok';go('wizard')">Bitişi 3 Ağustos yap (önerilen)</button></div>
         <button class="big" disabled>Devam et</button>`}
    ${backB}`;
  }

  if(n===6) body = `
    <h1>Kabul belgesini yükle.</h1>
    <p class="sub">Kuruma imzalattığın belge. İmza <b>ve</b> kaşe olduğundan emin ol.</p>
    <div class="upload" onclick="uploaded(this)">Belgeyi buraya sürükle veya <u>dosya seç</u><br>
    <span class="muted">PDF veya fotoğraf</span></div>
    <p class="center"><button class="link">Örnek doldurulmuş belgeyi gör</button></p>
    ${next()}${backB}`;

  if(n===7) body = `
    <h1>Son kontrol.</h1>
    <div class="box info">
      Yaz stajı · Örnek Yazılım A.Ş.<br>
      6 Temmuz – 3 Ağustos (20 iş günü ✓)<br>
      Sorumlu: A. Kaya, Bilgisayar Müh.<br>
      Kabul belgesi ✓ yüklendi
      <p style="margin-top:8px"><button class="link" onclick="student.wizardStep=1;go('wizard')">Bir şeyi değiştir</button></p>
    </div>
    <button class="big" onclick="student.stage='review';go('submitted')">Başvuruyu gönder</button>
    <p class="after">Gönderince komisyon inceleyecek; inceleme başlayana kadar değişiklik yapabilirsin.</p>
    ${backB}`;

  render(head + body, "home");
},

submitted(){
  render(`
    <div class="center"><div class="icon">✅</div></div>
    <h1 class="center">Başvurun gönderildi.</h1>
    <p class="sub center">Komisyon inceleyecek, sonucu e-posta ile bildireceğiz.<br><b>Şu an yapman gereken bir şey yok.</b></p>
    <button class="big" onclick="go('home')">Tamam</button>
  `, "home");
},

sgk(){
  render(`
    ${back}
    <h1>Sigorta girişine böyle bakılır:</h1>
    <div class="box info">
      <b>1.</b> turkiye.gov.tr'ye gir (e-Devlet)<br>
      <b>2.</b> Ara: <b>“SGK Tescil ve Hizmet Dökümü”</b><br>
      <b>3.</b> Listede staj başlangıç tarihinle bir kayıt olmalı
    </div>
    <button class="big" onclick="student.stage='during';go('sgkOk')">Kaydımı gördüm ✓</button>
    <button class="quiet" onclick="go('sgkFail')">Kaydımı göremiyorum</button>
  `, "home");
},

sgkOk(){
  render(`
    <div class="center"><div class="icon">👍</div></div>
    <h1 class="center">Harika, hazırsın!</h1>
    <p class="sub center">Stajın 6 Temmuz'da başlıyor. İyi stajlar!</p>
    <button class="big" onclick="go('home')">Tamam</button>
  `, "home");
},

sgkFail(){
  render(`
    <div class="center"><div class="icon">🙌</div></div>
    <h1 class="center">Sorun değil — bölüme bildirdik.</h1>
    <p class="sub center">Komisyon seninle iletişime geçecek.<br><b>Sigortan görünmeden staja başlama.</b></p>
    <button class="big" onclick="go('home')">Tamam</button>
  `, "home");
},

deliverCheck(){
  const items = ["Her staj günü için sayfa var (20 gün = 20 sayfa)",
    "Bütün sayfalar imzalı ve kaşeli","Kapak sayfası ekli",
    "Vlog bağlantısı ve QR kod son sayfada","PDF net okunuyor"];
  render(`
    ${back}
    <h1>Defterini yüklemeden önce kontrol et.</h1>
    <p class="sub">Eksik defterler geri döner — bu liste seni ondan kurtarır.</p>
    ${items.map(t=>`<label class="check"><input type="checkbox" onchange="chk()"> ${t}</label>`).join('')}
    <div class="upload" onclick="uploaded(this)">Defterini (PDF) buraya sürükle veya <u>dosya seç</u></div>
    <button class="big" id="upBtn" disabled onclick="student.stage='evaluating';go('delivered')">Defteri gönder</button>
    <p class="after" id="upWhy">Listeyi tamamlayınca buton açılır.</p>
    <div class="box warn"><b>Sicil fişi buraya yüklenmez.</b> Kapalı zarfla bölüm sekreterliğine elden götür.<br><br>
    <label class="check" style="border:0"><input type="checkbox" onchange="student.sicil=this.checked"> Zarfı teslim ettim</label></div>
  `, "home");
},

delivered(){
  render(`
    <div class="center"><div class="icon">📗</div></div>
    <h1 class="center">Defterini aldık.</h1>
    <p class="sub center">${student.sicil
      ? 'Sicil fişin de yolda — komisyon zarfı alınca onaylayacak.'
      : 'Unutma: sicil fişini kapalı zarfla bölüm sekreterliğine elden götürmen gerekiyor.'}</p>
    <button class="big" onclick="go('home')">Tamam</button>
  `, "home");
},

docs(){
  render(`
    <h1>Belgelerim</h1>
    <p class="sub">Şu an ihtiyacın olanlar en üstte.</p>
    <div class="qa open"><div class="q">📄 Günlük defter sayfası</div>
      <div class="a">Her staj günü için bir sayfa doldurursun; işyerindeki mühendisin imzalar.<br><br>
      <button class="quiet">Şablonu indir</button>
      <button class="link">Örnek doldurulmuş sayfa</button></div></div>
    <div class="qa"><div class="q" onclick="this.parentNode.classList.toggle('open')">📄 Defter kapağı</div>
      <div class="a">Ad-soyad, kurum ve tarihleri doldurup defterin başına eklersin.<br><br><button class="quiet">Şablonu indir</button></div></div>
    <div class="qa"><div class="q" onclick="this.parentNode.classList.toggle('open')">🎬 Vlog rehberi</div>
      <div class="a">Staj boyunca çekeceğin kısa videoların kuralları. Bağlantı ve QR kod defterin son sayfasına eklenir.<br><br><button class="quiet">Rehberi aç</button></div></div>
    <div class="qa"><div class="q" onclick="this.parentNode.classList.toggle('open')">✉️ Sicil fişi</div>
      <div class="a">İşyerinin senin hakkında doldurduğu değerlendirme. <b>Sisteme yüklenmez</b> — kapalı zarfla bölüm sekreterliğine elden götürülür.</div></div>
    <div class="qa"><div class="q" onclick="this.parentNode.classList.toggle('open')">✅ Kabul belgen (onaylandı)</div>
      <div class="a">Başvurunda yüklemiştin; komisyon onayladı. Yapman gereken bir şey yok.</div></div>
  `, "docs");
},

help(){
  render(`
    <h1>Yardım</h1>
    <input type="text" placeholder="Sorunu yaz, ör: kaç gün staj yapmam gerekiyor?"
      oninput="document.getElementById('res').style.display = this.value.length>3 ? 'block':'none'">
    <div id="res" style="display:none">
      <div class="qa open"><div class="q">Staj en az kaç iş günü olmalı?</div>
      <div class="a">En az <b>20 iş günü</b>. Hafta sonları ve tatiller sayılmaz — tarih seçerken sistem senin yerine hesaplar.<br><br>
      İşine yaradı mı? <button class="link">👍</button> <button class="link">👎</button></div></div>
    </div>
    <h1 style="font-size:18px;margin-top:24px">Çok sorulanlar</h1>
    <div class="qa"><div class="q" onclick="this.parentNode.classList.toggle('open')">Defteri ne zaman teslim edeceğim?</div>
      <div class="a">Staj bitince, en geç <b>15 Ekim</b>'e kadar buradan PDF yüklersin. Zamanı gelince ana sayfan seni zaten yönlendirir.</div></div>
    <div class="qa"><div class="q" onclick="this.parentNode.classList.toggle('open')">Sicil fişini de mi yükleyeceğim?</div>
      <div class="a">Hayır — kapalı zarfla bölüm sekreterliğine elden götürülür.</div></div>
    <div class="qa"><div class="q" onclick="this.parentNode.classList.toggle('open')">Başvurum onaylandı mı?</div>
      <div class="a">“Stajım” sayfasının ilk cümlesi her zaman güncel durumundur. Değişince e-posta da gelir.</div></div>
    <div class="box info">Cevabını bulamadın mı? <button class="link" onclick="go('ask')">Komisyona sor</button></div>
  `, "help");
},

ask(){
  render(`
    ${back}
    <h1>Komisyona sor</h1>
    <textarea rows="3" placeholder="Sorunu buraya yaz…"
      oninput="document.getElementById('sim').style.display = this.value.length>8 ? 'block':'none';
               document.getElementById('send').disabled = this.value.length<=8"></textarea>
    <div id="sim" style="display:none" class="box info"><b>Benzer sorular daha önce cevaplanmış:</b><br>
      • Defter ne zaman teslim edilir? — <button class="link" onclick="go('help')">cevabı gör</button><br>
      • Sicil fişi de yüklenecek mi? — <button class="link" onclick="go('help')">cevabı gör</button></div>
    <button class="big" id="send" disabled onclick="go('askDone')">Cevabım yok, soruyu gönder</button>
  `, "help");
},

askDone(){
  render(`
    <div class="center"><div class="icon">📨</div></div>
    <h1 class="center">Sorun komisyona iletildi.</h1>
    <p class="sub center">Cevap gelince e-posta ile haber vereceğiz.</p>
    <button class="big" onclick="go('home')">Tamam</button>
  `, "help");
}
};

function go(name){ (screens[name]||screens.home)(); }
function pick(stage){ student.stage = stage; document.getElementById("cont").disabled = false; }
function uploaded(el){ el.innerHTML = "✓ Belgeni aldık <span class='muted'>· staj_belgesi.pdf · <u>değiştir</u></span>";
  el.style.borderStyle="solid"; el.style.borderColor="#16a34a"; el.style.color="#166534"; el.style.background="#f0fdf4"; }
function fixDone(){ student.stage="review"; render(`
  <div class="center"><div class="icon">✅</div></div>
  <h1 class="center">Belgen komisyona gitti.</h1>
  <p class="sub center">Sonuçlanınca haber vereceğiz. Şu an yapman gereken bir şey yok.</p>
  <button class="big" onclick="go('home')">Tamam</button>`, "home"); }
function chk(){
  const boxes = document.querySelectorAll("main .check input");
  const need = [...boxes].slice(0,5);
  const all = need.every(b=>b.checked);
  document.getElementById("upBtn").disabled = !all;
  document.getElementById("upWhy").textContent = all ? "Hazırsın — gönderebilirsin." : "Listeyi tamamlayınca buton açılır.";
}

screens.login();
</script>
</body>
</html>
